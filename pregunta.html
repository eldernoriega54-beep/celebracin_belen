<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificación de Cumpleaños - Asrti Belen Paz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0d14;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo ambiental con sutil resplandor */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(236, 72, 153, 0.08) 50%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    /* Contenedor dividido estilo Split Card (como la imagen) */
    .split-card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: row;
      width: 880px;
      max-width: 100%;
      min-height: 520px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(99, 102, 241, 0.1);
      overflow: hidden;
      animation: cardAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================================
       PANEL IZQUIERDO: LAS CRIATURAS ANIMADAS
       ========================================================= */
    .creatures-panel {
      flex: 1.1;
      background: #141724;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 30px 20px 0 20px;
      overflow: hidden;
      user-select: none;
    }

    .brand-tag {
      position: absolute;
      top: 28px;
      left: 28px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    .creatures-stage {
      width: 100%;
      height: 380px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom center;
    }

    /* SVG de criaturas */
    .creatures-svg {
      width: 100%;
      height: 100%;
      max-width: 420px;
      overflow: visible;
    }

    /* Pupilas e iris interactivos */
    .pupil, .eye-shape {
      transition: transform 0.08s ease-out;
      transform-origin: center;
    }

    /* =========================================================
       ESTADOS DE LAS CRIATURAS
       ========================================================= */

    /* 1. Despertar en carga */
    .sleeping .creature-eye {
      transform: scaleY(0.08);
      transition: transform 0.4s ease;
    }

    .awake .creature-eye {
      transform: scaleY(1);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 2. Muy atentos cuando vas a escribir (se acercan al formulario) */
    .creatures-stage.attentive {
      transform: translateX(32px) skewX(-3deg) scale(1.03);
    }

    .creatures-stage.attentive #yellowCreature {
      transform: translateX(18px) rotate(4deg);
      transition: transform 0.35s ease;
    }

    .creatures-stage.attentive #orangeCreature {
      transform: translateX(12px) rotate(3deg);
      transition: transform 0.35s ease;
    }

    .creatures-stage.attentive #blackCreature {
      transform: translateY(-8px) rotate(2deg);
      transition: transform 0.35s ease;
    }

    .creatures-stage.attentive #purpleCreature {
      transform: translateX(10px) rotate(2.5deg);
      transition: transform 0.35s ease;
    }

    /* 3. Se asustan cuando te equivocas (se echan para atrás y niegan) */
    .creatures-stage.scared {
      transform: translateX(-40px) scale(0.92);
      animation: shakeNo 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    }

    @keyframes shakeNo {
      0%, 100% { transform: translateX(-40px) rotate(0deg) scale(0.92); }
      20% { transform: translateX(-48px) rotate(-5deg) scale(0.92); }
      40% { transform: translateX(-32px) rotate(5deg) scale(0.92); }
      60% { transform: translateX(-46px) rotate(-4deg) scale(0.92); }
      80% { transform: translateX(-35px) rotate(4deg) scale(0.92); }
    }

    .creatures-stage.scared .pupil {
      transform: scale(0.5) !important;
      fill: #e11d48 !important;
    }

    .creatures-stage.scared #mouthYellow {
      d: path("M 305 240 Q 312 248 318 240 Q 324 232 330 240") !important;
      stroke: #e11d48 !important;
    }

    /* 4. Celebración cuando aciertas */
    .creatures-stage.celebrating {
      transform: translateY(-10px) scale(1.05);
      animation: happyCheer 0.6s ease infinite alternate;
    }

    @keyframes happyCheer {
      0% { transform: translateY(-5px) scale(1.02); }
      100% { transform: translateY(-22px) scale(1.06); }
    }

    .creatures-stage.celebrating #mouthYellow {
      d: path("M 306 235 Q 318 250 330 235") !important;
      stroke: #16a34a !important;
    }

    /* =========================================================
       PANEL DERECHO: FORMULARIO ELEGANTE
       ========================================================= */
    .form-panel {
      flex: 1;
      padding: 50px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
      position: relative;
    }

    .form-header {
      margin-bottom: 28px;
    }

    .form-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 16px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-wrapper input:focus {
      background: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .input-wrapper input::placeholder {
      color: #94a3b8;
    }

    /* Botón Submit */
    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.25);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    /* Mensajes de feedback */
    .feedback-box {
      margin-top: 18px;
      min-height: 24px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border-radius: 8px;
      padding: 6px 10px;
      transition: all 0.3s ease;
    }

    .feedback-box.error {
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fecaca;
    }

    .feedback-box.success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .return-link {
      display: block;
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }

    .return-link:hover {
      color: #6366f1;
    }

    /* Responsive: en móviles se apila verticalmente */
    @media (max-width: 768px) {
      .split-card {
        flex-direction: column;
        max-width: 440px;
      }
      .creatures-panel {
        height: 250px;
        padding-top: 20px;
      }
      .creatures-stage {
        height: 220px;
      }
      .form-panel {
        padding: 35px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="split-card">
    <!-- PANEL IZQUIERDO: CRIATURAS ANIMADAS -->
    <div class="creatures-panel">
      <div class="brand-tag">✨ Regalo Especial ✨</div>

      <div class="creatures-stage awake" id="creaturesStage">
        <svg class="creatures-svg" viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Filtro de sombra suave -->
            <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
            </filter>
          </defs>

          <!-- 1. CRIATURA MORADA (Fondo Izquierda, diagonal inclinada) -->
          <g id="purpleCreature" style="transform-origin: 120px 320px; transition: transform 0.4s ease;">
            <!-- Cuerpo morado geométrico estilizado inclinado -->
            <path d="M 85 320 L 95 105 Q 98 85 118 78 L 155 64 Q 172 58 182 75 L 205 320 Z" 
                  fill="#6037e0" filter="url(#softShadow)" />
            
            <!-- Ojos horizontales blancos minimalistas de la criatura morada -->
            <g id="purpleEyes">
              <!-- Ojo izquierdo -->
              <rect class="creature-eye eye-shape" x="125" y="105" width="14" height="6" rx="3" fill="#ffffff" />
              <!-- Ojo derecho -->
              <rect class="creature-eye eye-shape" x="145" y="98" width="14" height="6" rx="3" fill="#ffffff" />
            </g>
          </g>

          <!-- 2. CRIATURA NEGRA / CARBÓN (Centro, pilar alto con ojos en el borde) -->
          <g id="blackCreature" style="transform-origin: 215px 320px; transition: transform 0.4s ease;">
            <!-- Cuerpo rectangular redondeado oscuro -->
            <rect x="180" y="130" width="70" height="190" rx="16" fill="#1b1e28" filter="url(#softShadow)" />
            
            <!-- Ojos en el borde superior -->
            <g id="blackEyes">
              <!-- Globo ocular izquierdo -->
              <circle cx="202" cy="148" r="8" fill="#ffffff" />
              <circle class="pupil" id="pupilBlackL" cx="202" cy="148" r="4.5" fill="#111827" />

              <!-- Globo ocular derecho -->
              <circle cx="225" cy="148" r="8" fill="#ffffff" />
              <circle class="pupil" id="pupilBlackR" cx="225" cy="148" r="4.5" fill="#111827" />
            </g>
          </g>

          <!-- 3. CRIATURA NARANJA (Frente Izquierda, cúpula gordita y tierna) -->
          <g id="orangeCreature" style="transform-origin: 85px 320px; transition: transform 0.4s ease;">
            <!-- Domo redondo anaranjado -->
            <path d="M 15 320 C 15 210, 155 210, 155 320 Z" fill="#f87454" filter="url(#softShadow)" />
            
            <!-- Ojitos negros curiosos con destellos -->
            <g id="orangeEyes">
              <!-- Ojo izquierdo -->
              <circle class="creature-eye pupil" id="pupilOrangeL" cx="72" cy="245" r="5" fill="#111827" />
              <!-- Destello izquierdo -->
              <circle cx="70.5" cy="243.5" r="1.5" fill="#ffffff" />

              <!-- Ojo derecho -->
              <circle class="creature-eye pupil" id="pupilOrangeR" cx="98" cy="245" r="5" fill="#111827" />
              <!-- Destello derecho -->
              <circle cx="96.5" cy="243.5" r="1.5" fill="#ffffff" />
            </g>
          </g>

          <!-- 4. CRIATURA AMARILLA (Frente Derecha, cápsula que se asoma curiosa al formulario) -->
          <g id="yellowCreature" style="transform-origin: 315px 320px; transition: transform 0.4s ease;">
            <!-- Cápsula amarilla alargada -->
            <path d="M 270 320 L 270 215 C 270 170, 360 170, 360 215 L 360 320 Z" fill="#e5d848" filter="url(#softShadow)" />
            
            <!-- Ojitos redondos con pupilas que miran -->
            <g id="yellowEyes">
              <!-- Ojo izquierdo -->
              <circle cx="305" cy="210" r="7.5" fill="#ffffff" />
              <circle class="pupil" id="pupilYellowL" cx="305" cy="210" r="4" fill="#111827" />
              <circle cx="303.5" cy="208.5" r="1.5" fill="#ffffff" />

              <!-- Ojo derecho -->
              <circle cx="328" cy="210" r="7.5" fill="#ffffff" />
              <circle class="pupil" id="pupilYellowR" cx="328" cy="210" r="4" fill="#111827" />
              <circle cx="326.5" cy="208.5" r="1.5" fill="#ffffff" />
            </g>

            <!-- Boquita tierna de línea (se anima si se asusta o sonríe) -->
            <path id="mouthYellow" d="M 308 238 L 325 238" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none" style="transition: all 0.3s ease;" />
          </g>
        </svg>
      </div>
    </div>

    <!-- PANEL DERECHO: FORMULARIO DE ACCESO -->
    <div class="form-panel">
      <div class="form-header">
        <h2>Welcome back! ✨</h2>
        <p>Por favor confirma a quién está dedicado este detalle especial</p>
      </div>

      <form id="verifForm">
        <div class="form-group">
          <label for="nombreInput">Nombre</label>
          <div class="input-wrapper">
            <input type="text" id="nombreInput" placeholder="Ej: Asrti Belen" autocomplete="off" required />
          </div>
        </div>

        <div class="form-group">
          <label for="apellidoInput">Apellido</label>
          <div class="input-wrapper">
            <input type="text" id="apellidoInput" placeholder="Ej: Paz" autocomplete="off" required />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Abrir Pastel y Regalo 🎂</span>
        </button>

        <div class="feedback-box" id="feedbackBox" style="display:none;"></div>
      </form>

      <a href="index.html" class="return-link">⬅ Volver a ver la animación de cumpleaños</a>
    </div>
  </div>

  <script>
    // Audio sintetizado offline
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.2) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const stage = document.getElementById('creaturesStage');
    const nombreInput = document.getElementById('nombreInput');
    const apellidoInput = document.getElementById('apellidoInput');
    const form = document.getElementById('verifForm');
    const feedbackBox = document.getElementById('feedbackBox');

    // Despertar animado al abrir la página
    stage.classList.add('sleeping');
    setTimeout(() => {
      stage.classList.remove('sleeping');
      stage.classList.add('awake');
      playBeep(440, 'triangle', 0.15);
    }, 450);

    // =========================================================
    // SEGUIMIENTO DE CURSOR CON LA MIRADA
    // =========================================================
    const pupils = [
      { el: document.getElementById('pupilBlackL'), maxDist: 4.5 },
      { el: document.getElementById('pupilBlackR'), maxDist: 4.5 },
      { el: document.getElementById('pupilOrangeL'), maxDist: 3.5 },
      { el: document.getElementById('pupilOrangeR'), maxDist: 3.5 },
      { el: document.getElementById('pupilYellowL'), maxDist: 4.0 },
      { el: document.getElementById('pupilYellowR'), maxDist: 4.0 }
    ];

    const purpleEyes = document.getElementById('purpleEyes');

    function updatePupils(cursorX, cursorY) {
      if (stage.classList.contains('scared')) return; // Si están asustados tienen su propia reacción

      pupils.forEach(item => {
        if (!item.el) return;
        const rect = item.el.getBoundingClientRect();
        const eyeCenterX = rect.left + rect.width / 2;
        const eyeCenterY = rect.top + rect.height / 2;

        const dx = cursorX - eyeCenterX;
        const dy = cursorY - eyeCenterY;
        const angle = Math.atan2(dy, dx);
        const distance = Math.min(item.maxDist, Math.hypot(dx, dy) / 35);

        const moveX = Math.cos(angle) * distance;
        const moveY = Math.sin(angle) * distance;

        item.el.style.transform = `translate(${moveX}px, ${moveY}px)`;
      });

      // Ojos de la criatura morada (desplazamiento horizontal sutil)
      if (purpleEyes) {
        const pRect = purpleEyes.getBoundingClientRect();
        const pdx = cursorX - (pRect.left + pRect.width / 2);
        const pMoveX = Math.max(-5, Math.min(5, pdx / 40));
        purpleEyes.style.transform = `translateX(${pMoveX}px)`;
      }
    }

    window.addEventListener('mousemove', (e) => {
      updatePupils(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updatePupils(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    // =========================================================
    // ATENCIÓN TOTAL CUANDO VAS A ESCRIBIR (SE ACERCAN AL FORMULARIO)
    // =========================================================
    function setAttentiveState(active) {
      if (stage.classList.contains('scared') || stage.classList.contains('celebrating')) return;
      if (active) {
        stage.classList.add('attentive');
      } else {
        stage.classList.remove('attentive');
      }
    }

    [nombreInput, apellidoInput].forEach(inp => {
      inp.addEventListener('focus', () => {
        setAttentiveState(true);
        playBeep(620, 'sine', 0.08);
      });
      inp.addEventListener('blur', () => {
        setAttentiveState(false);
      });
      inp.addEventListener('input', () => {
        setAttentiveState(true);
      });
    });

    // =========================================================
    // VALIDACIÓN: ERROR (SE ASUSTAN) O ÉXITO (CELEBRAN)
    // =========================================================
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const nom = nombreInput.value.trim().toLowerCase();
      const ape = apellidoInput.value.trim().toLowerCase();

      // Normalizar acentos
      const cleanNom = nom.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const cleanApe = ape.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      const isBelen = cleanNom.includes("asrti") || cleanNom.includes("belen");
      const isPaz = cleanApe.includes("paz");

      if (!cleanNom || !cleanApe || !isBelen || !isPaz) {
        // ERROR: SE ASUSTAN, SE HACEN PARA ATRÁS Y DICEN NO CON LA CABEZA
        stage.classList.remove('attentive', 'celebrating');
        stage.classList.add('scared');

        feedbackBox.style.display = 'block';
        feedbackBox.className = 'feedback-box error';
        feedbackBox.textContent = '¡Ouch! Esos no son los datos de la cumpleañera... ¿Es Asrti Belen Paz? 🥺';

        // Sonido de susto / error
        playBeep(180, 'sawtooth', 0.35);

        // Volver a estado normal después de un momento
        setTimeout(() => {
          stage.classList.remove('scared');
          if (document.activeElement === nombreInput || document.activeElement === apellidoInput) {
            stage.classList.add('attentive');
          }
        }, 1800);

        return;
      }

      // ÉXITO: CELEBRACIÓN Y PASE AL PASTEL
      stage.classList.remove('attentive', 'scared');
      stage.classList.add('celebrating');

      feedbackBox.style.display = 'block';
      feedbackBox.className = 'feedback-box success';
      feedbackBox.textContent = `¡Identidad confirmada! ¡Bienvenida, ${nombreInput.value.trim()} ${apellidoInput.value.trim()}! 🎉🎂`;

      // Melodía victoriosa
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 'triangle', 0.25), idx * 100);
      });

      setTimeout(() => {
        window.location.href = `pastel/index.html?nombre=${encodeURIComponent(nombreInput.value.trim())}&apellido=${encodeURIComponent(apellidoInput.value.trim())}`;
      }, 1500);
    });
  </script>
</body>
</html>
